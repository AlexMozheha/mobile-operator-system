server:
  port: 8082
  error:
    include-stacktrace: never
    include-message: always


spring:
  application:
    name: billing-service

  datasource:
    url: jdbc:h2:mem:billing_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        service-name: billing-service
        prefer-ip-address: true
        register: true
        health-check-path: /actuator/health
        health-check-interval: 10s
        instance-id: billing-service-8082

  spring.h2.console:
    enabled: true
    path: /h2-console

  logging:
    level:
      org.springframework.web: INFO

  management:
    endpoints:
      web:
        exposure:
          include: health
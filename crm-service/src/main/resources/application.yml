server:
  port: 8081
  error:
    include-stacktrace: never
    include-message: always


spring:
  application:
    name: crm-service

  datasource:
    url: jdbc:h2:mem:crm_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true

  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        service-name: crm-service
        prefer-ip-address: true
        register: true
        health-check-path: /actuator/health
        health-check-interval: 10s
        instance-id: crm-service-8081

spring.h2.console:
  enabled: true
  path: /h2-console

logging:
  level:
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: health